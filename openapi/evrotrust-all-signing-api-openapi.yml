openapi: 3.2.0
info:
  description: This is Evrotrust Vendor callback server API
  version: 1.0.22
  title: Evrotrust All Signing API
  contact:
    name: Evrotrust
    email: technical_support@evrotrust.com
servers:
- url: https://api.sandbox.evrotrust.com/vendor
  description: Testing
- url: https://v.evrotrust.com/vendor
  description: Production
tags:
- name: All Signing
paths:
  /document/download:
    post:
      description: /document/download
      responses:
        '200':
          description: File downloaded
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                required:
                - name
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                required:
                - name
        '438':
          description: User not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                required:
                - name
        '443':
          description: Document not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                required:
                - name
      parameters:
      - in: header
        name: Authorization
        schema:
          type: string
        required: true
        description: Authorization value.
      summary: Download File
      operationId: post_document-download
      x-readme:
        code-samples:
        - language: python
          name: Python
          code: "import hashlib, hmac, requests\n\nVENDOR_API_KEY = 'xxx'\nURL = 'https://api.sandbox.evrotrust.com/vendor/document/download'\n\nbody = \"\"\"{\n  \"transactionID\": \"a1b2c3d4-0000-0000-0000-000000000000\",\n  \"vendorNumber\": \"YOUR_VENDOR_NUMBER\"\n}\"\"\"\n\n# Authorization: HMAC-SHA256 over the exact body bytes,\n# keyed by the raw SHA-256 digest of the API key\nkey = hashlib.sha256(VENDOR_API_KEY.encode()).digest()\nauthorization = hmac.new(key, body.encode('utf-8'), hashlib.sha256).hexdigest()\n\nresponse = requests.post(\n    URL,\n    headers={'Content-Type': 'application/json',\n             'Authorization': authorization},\n    data=body.encode('utf-8'),\n    timeout=30,\n)\n\nprint(response.status_code, response.text)\n"
        - language: node
          name: Node.js
          code: "const crypto = require('crypto');\n\nconst VENDOR_API_KEY = 'xxx';\nconst URL = 'https://api.sandbox.evrotrust.com/vendor/document/download';\n\nconst body = JSON.stringify({\n  \"transactionID\": \"a1b2c3d4-0000-0000-0000-000000000000\",\n  \"vendorNumber\": \"YOUR_VENDOR_NUMBER\"\n});\n\n// Authorization: HMAC-SHA256 over the body, keyed by the raw SHA-256 of the API key\nconst key = crypto.createHash('sha256').update(VENDOR_API_KEY).digest();\nconst authorization = crypto.createHmac('sha256', key).update(body).digest('hex');\n\nconst response = await fetch(URL, {\n  method: 'POST',\n  headers: {\n    'Content-Type': 'application/json',\n    Authorization: authorization,\n  },\n  body,\n});\n\nconsole.log(response.status, await response.text());\n"
        samples-languages:
        - shell
      tags:
      - All Signing
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: "{\n  \"transactionID\": \"string\",\n  \"vendorNumber\": \"string\"\n}"
              required:
              - name
