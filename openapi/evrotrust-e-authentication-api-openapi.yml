info:
  description: This is Evrotrust Vendor callback server API
  version: 1.0.22
  title: Evrotrust E Authentication API
  contact:
    name: Evrotrust
    email: technical_support@evrotrust.com
servers:
- url: https://api.sandbox.evrotrust.com/vendor
  description: Testing
- url: https://v.evrotrust.com/vendor
  description: Production
tags:
- name: e-Authentication
paths:
  /document/auth/online:
    post:
      summary: eAuthentication
      description: /document/auth/online
      operationId: post_document-auth-online
      parameters:
      - in: header
        name: Authorization
        schema:
          type: string
        required: true
        description: See the Authorization guide for details.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                    description: '{

                      "transactionID":"string",

                      "threadID":"string"

                      }'
                required:
                - name
        '400':
          description: Invalid data supplied
          content: {}
        '401':
          description: Unauthorized
          content: {}
        '438':
          description: User not found
          content: {}
      x-readme:
        code-samples:
        - language: python
          name: Python
          code: "import hashlib, hmac, requests\n\nVENDOR_API_KEY = 'xxx'\nURL = 'https://api.sandbox.evrotrust.com/vendor/document/auth/online'\n\nbody = \"\"\"{\n  \"vendorNumber\": \"V123456\",\n  \"document\": {\n    \"description\": \"Contract agreement for review\",\n    \"dateExpire\": 1735689600\n  },\n  \"signInfo\": {\n    \"algorithm\": \"SHA256\"\n  },\n  \"user\": {\n    \"identificationNumber\": \"1234567890\",\n    \"country\": \"BG\"\n  },\n  \"publicKey\": \"LS0tLS1CRUdJTiBQVUJMSUMgS0VZLS0tLS0...\",\n  \"isRequiredSigning\": false\n}\"\"\"\n\n# Authorization: HMAC-SHA256 over the exact body bytes,\n# keyed by the raw SHA-256 digest of the API key\nkey = hashlib.sha256(VENDOR_API_KEY.encode()).digest()\nauthorization = hmac.new(key, body.encode('utf-8'), hashlib.sha256).hexdigest()\n\nresponse = requests.post(\n    URL,\n    headers={'Content-Type': 'application/json',\n             'Authorization': authorization},\n    data=body.encode('utf-8'),\n    timeout=30,\n)\n\nprint(response.status_code, response.text)\n"
          correspondingExample: success
        - language: node
          name: Node.js
          code: "const crypto = require('crypto');\n\nconst VENDOR_API_KEY = 'xxx';\nconst URL = 'https://api.sandbox.evrotrust.com/vendor/document/auth/online';\n\nconst body = JSON.stringify({\n  \"vendorNumber\": \"V123456\",\n  \"document\": {\n    \"description\": \"Contract agreement for review\",\n    \"dateExpire\": 1735689600\n  },\n  \"signInfo\": {\n    \"algorithm\": \"SHA256\"\n  },\n  \"user\": {\n    \"identificationNumber\": \"1234567890\",\n    \"country\": \"BG\"\n  },\n  \"publicKey\": \"LS0tLS1CRUdJTiBQVUJMSUMgS0VZLS0tLS0...\",\n  \"isRequiredSigning\": false\n});\n\n// Authorization: HMAC-SHA256 over the body, keyed by the raw SHA-256 of the API key\nconst key = crypto.createHash('sha256').update(VENDOR_API_KEY).digest();\nconst authorization = crypto.createHmac('sha256', key).update(body).digest('hex');\n\nconst response = await fetch(URL, {\n  method: 'POST',\n  headers: {\n    'Content-Type': 'application/json',\n    Authorization: authorization,\n  },\n  body,\n});\n\nconsole.log(response.status, await response.text());\n"
        samples-languages:
        - php
        - csharp
      tags:
      - e-Authentication
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: "{\n  \"vendorNumber\": \"\",\n  \"document\": {\n    \"description\": \"\",\n    \"dateExpire\":\n  },\n  \"signInfo\": {\n    \"algorithm\": \"SHA256\"\n  },\n  \"user\": {\n    \"identificationNumber\": \"\",\n    \"country\": \"\",\n    //\"phone\":\"+123456789000\",\n    //\"email\": \"user@example.com\"\n    //\"automatedSignCertID\":\"\",\n   //\"automatedSignSealID\":\"\"\n  },\n  \"publicKey\": \"LS0tLS1CRUdJTiBQVUJMSUMgS0VZLS0tLS0...\",\n  \"isRequiredSigning\": false\n}"
              required:
              - name
