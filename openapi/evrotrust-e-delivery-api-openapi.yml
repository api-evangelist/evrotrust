openapi: 3.2.0
info:
  description: This is Evrotrust Vendor callback server API
  version: 1.0.22
  title: Evrotrust E Delivery API
  contact:
    name: Evrotrust
    email: technical_support@evrotrust.com
servers:
- url: https://api.sandbox.evrotrust.com/vendor
  description: Testing
- url: https://v.evrotrust.com/vendor
  description: Production
tags:
- name: e-Delivery
paths:
  /delivery/online:
    post:
      description: /delivery/online
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                    description: '{

                      "threadID":"string",

                      "transactions": [

                      {"transactionID":"string",

                      "identificationNumber":"string",

                      "country": 0,

                      "email":"string",

                      "phone":"string"}]

                      }'
                required:
                - name
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                required:
                - name
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                required:
                - name
      parameters:
      - in: header
        name: Authorization
        schema:
          type: string
        required: true
        description: Authorization value.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                document:
                  type: object
                  properties: {}
                  description: File bytes
                data:
                  type: string
                  description: 'JSON string with structure

                    {

                    "document": {

                    "description": "string",

                    "dateExpire": 0,

                    "checksumDocument": "string"

                    },

                    "vendorNumber": "string",

                    "user": {

                    "identificationNumber": "string",

                    "country": "string",

                    "email": "string",

                    "phone": "string"}

                    }'
                  format: json
              required:
              - document
              - data
            examples:
              default:
                summary: Example request
                value:
                  document: {}
                  data: <data>
      summary: Send File for Delivery
      operationId: post_delivery-online
      tags:
      - e-Delivery
      x-readme:
        code-samples:
        - language: python
          name: Python
          code: "import hashlib, hmac, requests\n\nVENDOR_API_KEY = 'xxx'\nURL = 'https://api.sandbox.evrotrust.com/vendor/delivery/online'\n\n# e-Delivery: the recipient receives the file, there is no signing step.\n# Identify the user with ONE of identificationNumber+country, email or phone.\n# The HMAC covers the `data` string only -- not the file.\ndata = \"\"\"{\n  \"document\": {\n    \"description\": \"Invoice 2026-00142\",\n    \"dateExpire\": 1798761599,\n    \"checksumDocument\": \"9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08\"\n  },\n  \"vendorNumber\": \"YOUR_VENDOR_NUMBER\",\n  \"user\": {\n    \"identificationNumber\": \"1234567890\",\n    \"country\": \"BG\",\n    \"email\": \"user@example.com\",\n    \"phone\": \"+359123456789\"\n  }\n}\"\"\"\n\nkey = hashlib.sha256(VENDOR_API_KEY.encode()).digest()\nauthorization = hmac.new(key, data.encode('utf-8'), hashlib.sha256).hexdigest()\n\nwith open('/path/to/invoice.pdf', 'rb') as fh:\n    response = requests.post(\n        URL,\n        headers={'Authorization': authorization},\n        data={'data': data},\n        files={'document': ('invoice.pdf', fh, 'application/pdf')},\n        timeout=30,\n    )\n\nprint(response.status_code, response.text)"
        - language: node
          name: Node.js
          code: "const crypto = require('crypto');\nconst fs = require('fs');\n\nconst VENDOR_API_KEY = 'xxx';\nconst URL = 'https://api.sandbox.evrotrust.com/vendor/delivery/online';\n\n// e-Delivery: the recipient receives the file, there is no signing step.\n// Identify the user with ONE of identificationNumber+country, email or phone.\n// The HMAC covers the `data` string only -- not the file.\nconst data = JSON.stringify({\n  \"document\": {\n    \"description\": \"Invoice 2026-00142\",\n    \"dateExpire\": 1798761599,\n    \"checksumDocument\": \"9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08\"\n  },\n  \"vendorNumber\": \"YOUR_VENDOR_NUMBER\",\n  \"user\": {\n    \"identificationNumber\": \"1234567890\",\n    \"country\": \"BG\",\n    \"email\": \"user@example.com\",\n    \"phone\": \"+359123456789\"\n  }\n});\n\nconst key = crypto.createHash('sha256').update(VENDOR_API_KEY).digest();\nconst authorization = crypto.createHmac('sha256', key).update(data).digest('hex');\n\nconst form = new FormData();\nform.append('data', data);\nform.append(\n  'document',\n  new Blob([fs.readFileSync('/path/to/invoice.pdf')], { type: 'application/pdf' }),\n  'invoice.pdf'\n);\n\nconst response = await fetch(URL, {\n  method: 'POST',\n  headers: { Authorization: authorization },\n  body: form,\n});\n\nconsole.log(response.status, await response.text());"
  /delivery/receipts/download:
    post:
      description: /delivery/receipts/download
      responses:
        '200':
          description: ''
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                required:
                - name
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                required:
                - name
        '443':
          description: Document not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                required:
                - name
        '475':
          description: Receipts cannot be generated
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                required:
                - name
      parameters:
      - in: header
        name: Authorization
        schema:
          type: string
        required: true
        description: Authorization value.
      summary: Download Receipts
      operationId: post_delivery-receipts-download
      tags:
      - e-Delivery
      x-readme:
        code-samples:
        - language: python
          name: Python
          code: "import hashlib, hmac, requests\n\nVENDOR_API_KEY = 'xxx'\nURL = 'https://api.sandbox.evrotrust.com/vendor/delivery/receipts/download'\n\nbody = \"\"\"{\n  \"transactionID\": \"a1b2c3d4-0000-0000-0000-000000000000\",\n  \"vendorNumber\": \"YOUR_VENDOR_NUMBER\"\n}\"\"\"\n\n# Authorization: HMAC-SHA256 over the exact body bytes,\n# keyed by the raw SHA-256 digest of the API key\nkey = hashlib.sha256(VENDOR_API_KEY.encode()).digest()\nauthorization = hmac.new(key, body.encode('utf-8'), hashlib.sha256).hexdigest()\n\nresponse = requests.post(\n    URL,\n    headers={'Content-Type': 'application/json',\n             'Authorization': authorization},\n    data=body.encode('utf-8'),\n    timeout=30,\n)\n\nprint(response.status_code, response.text)\n"
        - language: node
          name: Node.js
          code: "const crypto = require('crypto');\n\nconst VENDOR_API_KEY = 'xxx';\nconst URL = 'https://api.sandbox.evrotrust.com/vendor/delivery/receipts/download';\n\nconst body = JSON.stringify({\n  \"transactionID\": \"a1b2c3d4-0000-0000-0000-000000000000\",\n  \"vendorNumber\": \"YOUR_VENDOR_NUMBER\"\n});\n\n// Authorization: HMAC-SHA256 over the body, keyed by the raw SHA-256 of the API key\nconst key = crypto.createHash('sha256').update(VENDOR_API_KEY).digest();\nconst authorization = crypto.createHmac('sha256', key).update(body).digest('hex');\n\nconst response = await fetch(URL, {\n  method: 'POST',\n  headers: {\n    'Content-Type': 'application/json',\n    Authorization: authorization,\n  },\n  body,\n});\n\nconsole.log(response.status, await response.text());\n"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: '{

                    "transactionID":"string",

                    "vendorNumber":"string"

                    }'
              required:
              - name
