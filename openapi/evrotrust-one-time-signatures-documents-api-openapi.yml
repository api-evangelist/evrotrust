        - language: python
          name: Python
          code: "import hashlib, hmac, requests\n\nVENDOR_API_KEY = 'xxx'\nURL = 'https://api.sandbox.evrotrust.com/vendor/document/group/offline/file'\n\n# Three kinds of part: `documents` repeats once per entry in data['documents']\n# (same order), `signedfile` is the single RA IDV statement for the whole\n# group, and `data` is the JSON. The HMAC covers `data` only.\n\ndata = \"\"\"{\n  \"user\": {\n    \"country\": \"BG\",\n    \"identificationNumber\": \"1234567890\",\n    \"documentNumber\": \"AA1234567\",\n    \"firstName\": \"Ivan\",\n    \"middleName\": \"Petrov\",\n    \"lastName\": \"Ivanov\",\n    \"phone\": \"+359123456789\",\n    \"email\": \"user@example.com\",\n    \"language\": \"bg\"\n  },\n  \"documents\": [\n    {\n      \"description\": \"Service agreement\",\n      \"checksumDocument\": \"9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08\",\n      \"annotationParameters\": [\n        {\n          \"annotationText\": \"Signed by Evrotrust\",\n          \"fontName\": \"Helvetica\",\n          \"fontSize\": 10,\n          \"fontColor\": \"#000000\",\n          \"axisX\": 100,\n          \"axisY\": 150,\n          \"page\": 1\n        }\n      ]\n    },\n    {\n      \"description\": \"Annex A - pricing\",\n      \"checksumDocument\": \"60303ae22b998861bce3b28f33eec1be758a213c86c93c076dbe9f558c11c752\",\n      \"annotationParameters\": [\n        {\n          \"annotationText\": \"Signed by Evrotrust\",\n          \"fontName\": \"Helvetica\",\n          \"fontSize\": 10,\n          \"fontColor\": \"#000000\",\n          \"axisX\": 100,\n          \"axisY\": 150,\n          \"page\": 1\n        }\n      ]\n    }\n  ],\n  \"signInfo\": {\n    \"type\": \"PDF2\",\n    \"algorithm\": \"SHA256\"\n  },\n  \"groupDescription\": \"Service agreement and annex\",\n  \"coverage\": 20000,\n  \"certificateType\": 1,\n  \"vendorNumber\": \"YOUR_VENDOR_NUMBER\",\n  \"smsType\": 1,\n  \"publicKey\": \"BASE64_ENCODED_PUBLIC_KEY\",\n  \"urlCallback\": \"https://your-server.example.com/evrotrust/callback\"\n}\"\"\"\n\nkey = hashlib.sha256(VENDOR_API_KEY.encode()).digest()\nauthorization = hmac.new(key, data.encode('utf-8'), hashlib.sha256).hexdigest()\n\npaths = ['/path/to/agreement.pdf', '/path/to/annex-a.pdf']\nhandles = [open(p, 'rb') for p in paths]\nstatement = open('/path/to/ra-idv-statement.pdf', 'rb')\ntry:\n    files = [('documents', (p.split('/')[-1], fh, 'application/pdf'))\n             for p, fh in zip(paths, handles)]\n    files.append(('signedfile', ('ra-idv-statement.pdf', statement, 'application/pdf')))\n    response = requests.post(\n        URL,\n        headers={'Authorization': authorization},\n        data={'data': data},\n        files=files,\n        timeout=60,\n    )\nfinally:\n    for fh in handles:\n        fh.close()\n    statement.close()\n\nprint(response.status_code, response.text)"
        - language: node
          name: Node.js
          code: "const crypto = require('crypto');\nconst fs = require('fs');\n\nconst VENDOR_API_KEY = 'xxx';\nconst URL = 'https://api.sandbox.evrotrust.com/vendor/document/group/offline/file';\n\n// Three kinds of part: `documents` repeats once per entry in data.documents\n// (same order), `signedfile` is the single RA IDV statement for the whole\n// group, and `data` is the JSON. The HMAC covers `data` only.\n\nconst data = JSON.stringify({ /* byte-identical to the Python payload */ });\n\nconst key = crypto.createHash('sha256').update(VENDOR_API_KEY).digest();\nconst authorization = crypto.createHmac('sha256', key).update(data).digest('hex');\n\nconst files = ['/path/to/agreement.pdf', '/path/to/annex-a.pdf'];\n\nconst form = new FormData();\nform.append('data', data);\nfor (const file of files) {\n  form.append(\n    'documents',\n    new Blob([fs.readFileSync(file)], { type: 'application/pdf' }),\n    file.split('/').pop()\n  );\n}\nform.append(\n  'signedfile',\n  new Blob([fs.readFileSync('/path/to/ra-idv-statement.pdf')], { type: 'application/pdf' }),\n  'ra-idv-statement.pdf'\n);\n\nconst response = await fetch(URL, {\n  method: 'POST',\n  headers: { Authorization: authorization },\n  body: form,\n});\n\nconsole.log(response.status, await response.text());"
