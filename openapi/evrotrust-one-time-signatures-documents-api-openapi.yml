openapi: 3.2.0
info:
  description: This is Evrotrust Vendor callback server API
  version: 1.0.22
  title: Evrotrust One-time Signatures (Documents) API
  contact:
    name: Evrotrust
    email: technical_support@evrotrust.com
servers:
- url: https://api.sandbox.evrotrust.com/vendor
  description: Testing
- url: https://v.evrotrust.com/vendor
  description: Production
tags:
- name: One-time Signatures (Documents)
paths:
  /document/doc/offline:
    post:
      description: /document/doc/offline
      summary: OTP eSign PDF (Agent)
      operationId: post_document-doc-offline
      parameters:
      - in: header
        name: Authorization
        schema:
          type: string
        required: true
        description: Authorization value.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                    description: '{

                      "transactionID":"string"

                      }'
                required:
                - name
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                required:
                - name
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                required:
                - name
        '438':
          description: User not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                required:
                - name
        '449':
          description: User data is not valid
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                required:
                - name
        '450':
          description: File exceeds max allowed file size
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                required:
                - name
        '454':
          description: Incorrect coverage
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                required:
                - name
        '457':
          description: Not supported file types
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                required:
                - name
        '469':
          description: Request cannot be processed. Register check not successful.
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                required:
                - name
        '479':
          description: Person must be at least 18 years old.
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                required:
                - name
      tags:
      - One-time Signatures (Documents)
      x-readme:
        code-samples:
        - language: python
          name: Python
          code: "import hashlib, hmac, requests\n\nVENDOR_API_KEY = 'xxx'\nURL = 'https://api.sandbox.evrotrust.com/vendor/document/doc/offline'\n\n# The HMAC is computed over the `data` string only -- not the file.\n\ndata = \"\"\"{\n  \"user\": {\n    \"country\": \"BG\",\n    \"identificationNumber\": \"1234567890\",\n    \"documentNumber\": \"AA1234567\",\n    \"firstName\": \"Ivan\",\n    \"middleName\": \"Petrov\",\n    \"lastName\": \"Ivanov\",\n    \"phone\": \"+359123456789\",\n    \"email\": \"user@example.com\",\n    \"language\": \"bg\"\n  },\n  \"agent\": {\n    \"identificationNumber\": \"9876543210\",\n    \"country\": \"BG\",\n    \"phone\": \"+359987654321\"\n  },\n  \"document\": {\n    \"description\": \"Service agreement\",\n    \"coverage\": 20000,\n    \"certificateType\": 1,\n    \"checksumDocument\": \"9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08\",\n    \"annotationParameters\": [\n      {\n        \"annotationText\": \"Signed by Evrotrust\",\n        \"fontName\": \"Helvetica\",\n        \"fontSize\": 10,\n        \"fontColor\": \"#000000\",\n        \"axisX\": 100,\n        \"axisY\": 150,\n        \"page\": 1\n      }\n    ]\n  },\n  \"signInfo\": {\n    \"type\": \"PDF2\",\n    \"algorithm\": \"SHA256\"\n  },\n  \"vendorNumber\": \"YOUR_VENDOR_NUMBER\",\n  \"smsType\": 1,\n  \"publicKey\": \"BASE64_ENCODED_PUBLIC_KEY\",\n  \"urlCallback\": \"https://your-server.example.com/evrotrust/callback\"\n}\"\"\"\n\nkey = hashlib.sha256(VENDOR_API_KEY.encode()).digest()\nauthorization = hmac.new(key, data.encode('utf-8'), hashlib.sha256).hexdigest()\n\nwith open('/path/to/agreement.pdf', 'rb') as fh:\n    response = requests.post(\n        URL,\n        headers={'Authorization': authorization},\n        data={'data': data},\n        files={'document': ('agreement.pdf', fh, 'application/pdf')},\n        timeout=30,\n    )\n\nprint(response.status_code, response.text)"
        - language: node
          name: Node.js
          code: "const crypto = require('crypto');\nconst fs = require('fs');\n\nconst VENDOR_API_KEY = 'xxx';\nconst URL = 'https://api.sandbox.evrotrust.com/vendor/document/doc/offline';\n\n// The HMAC covers the `data` string only -- not the file.\n\nconst data = JSON.stringify({\n  \"user\": {\n    \"country\": \"BG\",\n    \"identificationNumber\": \"1234567890\",\n    \"documentNumber\": \"AA1234567\",\n    \"firstName\": \"Ivan\",\n    \"middleName\": \"Petrov\",\n    \"lastName\": \"Ivanov\",\n    \"phone\": \"+359123456789\",\n    \"email\": \"user@example.com\",\n    \"language\": \"bg\"\n  },\n  \"agent\": {\n    \"identificationNumber\": \"9876543210\",\n    \"country\": \"BG\",\n    \"phone\": \"+359987654321\"\n  },\n  \"document\": {\n    \"description\": \"Service agreement\",\n    \"coverage\": 20000,\n    \"certificateType\": 1,\n    \"checksumDocument\": \"9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08\",\n    \"annotationParameters\": [\n      {\n        \"annotationText\": \"Signed by Evrotrust\",\n        \"fontName\": \"Helvetica\",\n        \"fontSize\": 10,\n        \"fontColor\": \"#000000\",\n        \"axisX\": 100,\n        \"axisY\": 150,\n        \"page\": 1\n      }\n    ]\n  },\n  \"signInfo\": { \"type\": \"PDF2\", \"algorithm\": \"SHA256\" },\n  \"vendorNumber\": \"YOUR_VENDOR_NUMBER\",\n  \"smsType\": 1,\n  \"publicKey\": \"BASE64_ENCODED_PUBLIC_KEY\",\n  \"urlCallback\": \"https://your-server.example.com/evrotrust/callback\"\n});\n\nconst key = crypto.createHash('sha256').update(VENDOR_API_KEY).digest();\nconst authorization = crypto.createHmac('sha256', key).update(data).digest('hex');\n\nconst form = new FormData();\nform.append('data', data);\nform.append(\n  'document',\n  new Blob([fs.readFileSync('/path/to/agreement.pdf')], { type: 'application/pdf' }),\n  'agreement.pdf'\n);\n\nconst response = await fetch(URL, {\n  method: 'POST',\n  headers: { Authorization: authorization },\n  body: form,\n});\n\nconsole.log(response.status, await response.text());"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: "{\n  \"user\": {\n    \"country\": \"string\",\n    \"identificationNumber\": \"string\",\n    \"documentNumber\": \"string\",\n    \"firstName\": \"string\",\n    \"middleName\": \"string\",\n    \"lastName\": \"string\",\n    \"phone\": \"+string\",\n    \"email\": \"string\",\n    \"language\": \"string\"\n  },\n  \"agent\": {\n    \"identificationNumber\": \"string\",\n    \"country\": \"string\",\n    \"phone\": \"string\"\n  },\n  \"document\": {\n    \"description\": \"string\",\n    \"coverage\": 0,\n    \"certificateType\": 0,\n    \"checksumDocument\": \"string\",\n    \"annotationParameters\": [\n      {\n        \"annotationText\": \"Signed by Evrotrust\",\n        \"fontName\": \"string\",\n        \"fontSize\": integer,\n        \"fontColor\": \"string\",\n        \"axisX\": integer,\n        \"axisY\": integer,\n        \"page\": integer\n      }\n    ]\n  },\n  \"signInfo\": { \"type\": \"string\", \"algorithm\": \"SHA256\" },\n  \"vendorNumber\": \"string\",\n  \"smsType\": 0,\n  \"publicKey\": \"string\",\n  \"urlCallback\": \"string\"\n}"
              required:
              - name
