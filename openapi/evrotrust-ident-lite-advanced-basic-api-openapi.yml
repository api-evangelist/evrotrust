openapi: 3.2.0
info:
  description: This is Evrotrust Vendor callback server API
  version: 1.0.22
  title: Evrotrust Ident Lite (Advanced, Basic) API
  contact:
    name: Evrotrust
    email: technical_support@evrotrust.com
servers:
- url: https://api.sandbox.evrotrust.com/vendor
  description: Testing
- url: https://v.evrotrust.com/vendor
  description: Production
tags:
- name: Ident Lite (Advanced, Basic)
paths:
  /onetimeidentification/getdata:
    post:
      description: /onetimeidentification/getdata
      responses:
        '200':
          description: User data
          content:
            application/json:
              schema:
                type: object
                properties:
                  response:
                    type: string
                    description: '"oneTimeIdentificationDate": 0,

                      "identification": {

                      "personPresence": 0,

                      "liveness": 0,

                      "faceMatch": 0},

                      "user": {

                      "firstName":"string",

                      "middleName":"string",

                      "lastName":"string",

                      "firstNameLatin":"string",

                      "middleNameLatin":"string",

                      "lastNameLatin":"string",

                      "identificationNumber":"string",

                      "documentNumber":"string",

                      "docType":"string",

                      "documentValidDate": 0,

                      "documentIssuerName":"string",

                      "documentIssueDate": 0,

                      "documentCountryCode":"string",

                      "dateOfBirth": 0,

                      "placeOfBirth":"string",

                      "nationality":"string",

                      "nationalityCountryCode":"string",

                      "address":"string",

                      "district":"string",

                      "municipality":"string",

                      "settlement":"string",

                      "location":"string",

                      "buildingNumber":"string",

                      "entrance":"string",

                      "floor":"string",

                      "apartment":"string",

                      "userGender":"string",

                      "userPicture":"string",

                      "userSpecimen":"string",

                      "userIDFront":"string",

                      "userIDBack":"string",

                      "secretSelfie":"string",

                      "secretVideo":"string"

                      },

                      "sourceUserData": {

                      "firstName": 0,

                      "middleName": 0,

                      "lastName": 0,

                      "firstNameLatin": 0,

                      "middleNameLatin": 0,

                      "lastNameLatin": 0,

                      "identificationNumber": 0,

                      "documentNumber": 0,

                      "docType": 0,

                      "documentValidDate": 0,

                      "documentIssuerName": 0,

                      "documentIssueDate": 0,

                      "documentCountryCode": 0,

                      "dateOfBirth": 0,

                      "placeOfBirth": 0,

                      "nationality": 0,

                      "address": 0,

                      "userGender": 0,

                      "userPicture": 0,

                      "userSpecimen": 0'
                required:
                - response
        '400':
          description: Invalid Data Supplied
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                required:
                - name
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                required:
                - name
        '485':
          description: Reference ID not valid
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                required:
                - name
        '487':
          description: Reference ID expired
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                required:
                - name
      parameters:
      - in: header
        name: Authorization
        schema:
          type: string
        required: true
        description: Authorization value.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                vendorNumber:
                  type: string
                referenceID:
                  type: string
                includes:
                  type: object
                  properties:
                    names:
                      type: boolean
                    latinNames:
                      type: boolean
                    identificationNumber:
                      type: boolean
                    documentNumber:
                      type: boolean
                    documentType:
                      type: boolean
                    documentValidDate:
                      type: boolean
                    documentIssuerName:
                      type: boolean
                    documentIssueDate:
                      type: boolean
                    documentCountry:
                      type: boolean
                    address:
                      type: boolean
                    dateOfBirth:
                      type: boolean
                    placeOfBirth:
                      type: boolean
                    nationality:
                      type: boolean
                    gender:
                      type: boolean
                    documentPicture:
                      type: boolean
                      description: This parameter is for the user's profile picture.
                    documentSignature:
                      type: boolean
                      description: This parameter is for the user's signature picture.
                    picFront:
                      type: boolean
                      description: This paramter is for the picture of the side of the document with MRZ code on it.
                    picBack:
                      type: boolean
                      description: This paramter is for the picture of the other side of the document.
                    secretSelfie:
                      type: boolean
                    secretVideo:
                      type: boolean
                  description: "Set the required fields below to true, the rest to false:\n\n\"vendorNumber\": \"YOUR_VENDOR_NUMBER\",\n  \"referenceID\": \"\",\n  \"includes\": {\n    \"names\": true,\n    \"latinNames\": true,\n    \"identificationNumber\": true,\n    \"documentNumber\": true,\n    \"documentType\": true,\n    \"documentValidDate\": true,\n    \"documentIssuerName\": true,\n    \"documentIssueDate\": true,\n    \"documentCountry\": true,\n    \"address\": true,\n    \"dateOfBirth\": true,\n    \"placeOfBirth\": true,\n    \"nationality\": true,\n    \"gender\": true,\n    \"documentPicture\": true,\n    \"documentSignature\": true,\n    \"picFront\": true,\n    \"picBack\": true,\n    \"secretSelfie\": true,\n    \"secretVideo\": true\n}"
              required:
              - vendorNumber
              - referenceID
            examples:
              default:
                summary: Example request
                value:
                  vendorNumber: YOUR_VENDOR_NUMBER
                  referenceID: REF-00000000
                  includes:
                    names: true
                    latinNames: true
                    identificationNumber: '1234567890'
                    documentNumber: true
                    documentType: true
                    documentValidDate: true
                    documentIssuerName: true
                    documentIssueDate: true
                    documentCountry: BG
                    address: true
                    dateOfBirth: true
                    placeOfBirth: true
                    nationality: true
                    gender: true
                    documentPicture: true
                    documentSignature: true
                    picFront: true
                    picBack: true
                    secretSelfie: true
                    secretVideo: true
      summary: Get User Data
      x-readme:
        code-samples:
        - language: python
          name: Python
          code: "import hashlib, hmac, requests\n\nVENDOR_API_KEY = 'xxx'\nURL = 'https://api.sandbox.evrotrust.com/vendor/onetimeidentification/getdata'\n\nbody = \"\"\"{\n  \"vendorNumber\": \"YOUR_VENDOR_NUMBER\",\n  \"referenceID\": \"\",\n  \"includes\": {\n    \"names\": true,\n    \"latinNames\": true,\n    \"identificationNumber\": true,\n    \"documentNumber\": true,\n    \"documentType\": true,\n    \"documentValidDate\": true,\n    \"documentIssuerName\": true,\n    \"documentIssueDate\": true,\n    \"documentCountry\": true,\n    \"address\": true,\n    \"dateOfBirth\": true,\n    \"placeOfBirth\": true,\n    \"nationality\": true,\n    \"gender\": true,\n    \"documentPicture\": true,\n    \"documentSignature\": true,\n    \"picFront\": true,\n    \"picBack\": true,\n    \"secretSelfie\": true,\n    \"secretVideo\": true\n  }\n}\"\"\"\n\n# Authorization: HMAC-SHA256 over the exact body bytes,\n# keyed by the raw SHA-256 digest of the API key\nkey = hashlib.sha256(VENDOR_API_KEY.encode()).digest()\nauthorization = hmac.new(key, body.encode('utf-8'), hashlib.sha256).hexdigest()\n\nresponse = requests.post(\n    URL,\n    headers={'Content-Type': 'application/json',\n             'Authorization': authorization},\n    data=body.encode('utf-8'),\n    timeout=30,\n)\n\nprint(response.status_code, response.text)\n"
        - language: node
          name: Node.js
          code: "const crypto = require('crypto');\n\nconst VENDOR_API_KEY = 'xxx';\nconst URL = 'https://api.sandbox.evrotrust.com/vendor/onetimeidentification/getdata';\n\nconst body = JSON.stringify({\n  \"vendorNumber\": \"YOUR_VENDOR_NUMBER\",\n  \"referenceID\": \"\",\n  \"includes\": {\n    \"names\": true,\n    \"latinNames\": true,\n    \"identificationNumber\": true,\n    \"documentNumber\": true,\n    \"documentType\": true,\n    \"documentValidDate\": true,\n    \"documentIssuerName\": true,\n    \"documentIssueDate\": true,\n    \"documentCountry\": true,\n    \"address\": true,\n    \"dateOfBirth\": true,\n    \"placeOfBirth\": true,\n    \"nationality\": true,\n    \"gender\": true,\n    \"documentPicture\": true,\n    \"documentSignature\": true,\n    \"picFront\": true,\n    \"picBack\": true,\n    \"secretSelfie\": true,\n    \"secretVideo\": true\n  }\n});\n\n// Authorization: HMAC-SHA256 over the body, keyed by the raw SHA-256 of the API key\nconst key = crypto.createHash('sha256').update(VENDOR_API_KEY).digest();\nconst authorization = crypto.createHmac('sha256', key).update(body).digest('hex');\n\nconst response = await fetch(URL, {\n  method: 'POST',\n  headers: {\n    'Content-Type': 'application/json',\n    Authorization: authorization,\n  },\n  body,\n});\n\nconsole.log(response.status, await response.text());\n"
      operationId: post_onetimeidentification-getdata
      tags:
      - Ident Lite (Advanced, Basic)
