      x-readme:
        code-samples:
        - language: python
          name: Python
          code: "import hashlib, hmac, requests\n\nVENDOR_API_KEY = 'xxx'\nURL = 'https://api.sandbox.evrotrust.com/vendor/hash/group/offline/file/init'\n\n# The HMAC is computed over the `data` string only -- not the file.\n# One RA IDV statement covers the whole group; the hashes themselves are\n# sent later via /hash/group/offline/send.\ndata = \"\"\"{\n  \"user\": {\n    \"country\": \"BG\",\n    \"identificationNumber\": \"1234567890\",\n    \"documentNumber\": \"AA1234567\",\n    \"firstName\": \"Ivan\",\n    \"middleName\": \"Petrov\",\n    \"lastName\": \"Ivanov\",\n    \"phone\": \"+359123456789\",\n    \"email\": \"user@example.com\",\n    \"language\": \"bg\"\n  },\n  \"documents\": [\n    { \"description\": \"Service agreement\" },\n    { \"description\": \"Annex A - pricing\" }\n  ],\n  \"signInfo\": {\n    \"algorithm\": \"SHA256\"\n  },\n  \"coverage\": 20000,\n  \"certificateType\": 1,\n  \"vendorNumber\": \"YOUR_VENDOR_NUMBER\",\n  \"smsType\": 1,\n  \"groupDescription\": \"Service agreement and annex\",\n  \"publicKey\": \"BASE64_ENCODED_PUBLIC_KEY\",\n  \"urlCallback\": \"https://your-server.example.com/evrotrust/callback\"\n}\"\"\"\n\nkey = hashlib.sha256(VENDOR_API_KEY.encode()).digest()\nauthorization = hmac.new(key, data.encode('utf-8'), hashlib.sha256).hexdigest()\n\nwith open('/path/to/ra-idv-statement.pdf', 'rb') as fh:\n    response = requests.post(\n        URL,\n        headers={'Authorization': authorization},\n        data={'data': data},\n        files={'signedfile': ('ra-idv-statement.pdf', fh, 'application/pdf')},\n        timeout=30,\n    )\n\nprint(response.status_code, response.text)"
        - language: node
          name: Node.js
          code: "const crypto = require('crypto');\nconst fs = require('fs');\n\nconst VENDOR_API_KEY = 'xxx';\nconst URL = 'https://api.sandbox.evrotrust.com/vendor/hash/group/offline/file/init';\n\n// The HMAC covers the `data` string only -- not the file.\n// One RA IDV statement covers the whole group; the hashes themselves are\n// sent later via /hash/group/offline/send.\nconst data = JSON.stringify({\n  \"user\": {\n    \"country\": \"BG\",\n    \"identificationNumber\": \"1234567890\",\n    \"documentNumber\": \"AA1234567\",\n    \"firstName\": \"Ivan\",\n    \"middleName\": \"Petrov\",\n    \"lastName\": \"Ivanov\",\n    \"phone\": \"+359123456789\",\n    \"email\": \"user@example.com\",\n    \"language\": \"bg\"\n  },\n  \"documents\": [\n    { \"description\": \"Service agreement\" },\n    { \"description\": \"Annex A - pricing\" }\n  ],\n  \"signInfo\": { \"algorithm\": \"SHA256\" },\n  \"coverage\": 20000,\n  \"certificateType\": 1,\n  \"vendorNumber\": \"YOUR_VENDOR_NUMBER\",\n  \"smsType\": 1,\n  \"groupDescription\": \"Service agreement and annex\",\n  \"publicKey\": \"BASE64_ENCODED_PUBLIC_KEY\",\n  \"urlCallback\": \"https://your-server.example.com/evrotrust/callback\"\n});\n\nconst key = crypto.createHash('sha256').update(VENDOR_API_KEY).digest();\nconst authorization = crypto.createHmac('sha256', key).update(data).digest('hex');\n\nconst form = new FormData();\nform.append('data', data);\nform.append(\n  'signedfile',\n  new Blob([fs.readFileSync('/path/to/ra-idv-statement.pdf')], { type: 'application/pdf' }),\n  'ra-idv-statement.pdf'\n);\n\nconst response = await fetch(URL, {\n  method: 'POST',\n  headers: { Authorization: authorization },\n  body: form,\n});\n\nconsole.log(response.status, await response.text());"
