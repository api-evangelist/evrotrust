info:
  description: This is Evrotrust Vendor callback server API
  version: 1.0.22
  title: Evrotrust E Signatures API
  contact:
    name: Evrotrust
    email: technical_support@evrotrust.com
servers:
- url: https://api.sandbox.evrotrust.com/vendor
  description: Testing
- url: https://v.evrotrust.com/vendor
  description: Production
tags:
- name: e-Signatures
paths:
  /certificate/hash/offline/ready:
    post:
      tags:
      - e-Signatures
      summary: One-time Signing Certificate Hash Ready
      description: 'One-time signing certificate hash ready. Valid status values:

        "status": 2 - Active, 3 - Blocked, 4 - Revoked. The callback is triggered only on Active status.'
      operationId: readyOfflineHashCertificate
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DataHashOfflineCertificateReady'
            examples:
              default:
                summary: Example request
                value:
                  transactionID: a1b2c3d4-0000-0000-0000-000000000000
                  status: 1
        description: Document info
        required: true
      responses:
        '204':
          description: Success
      x-readme:
        code-samples:
        - language: python
          name: Python
          code: "import hashlib, hmac, requests\n\nVENDOR_API_KEY = 'xxx'\nURL = 'https://api.sandbox.evrotrust.com/vendor/certificate/hash/offline/ready'\n\nbody = \"\"\"{\n  \"transactionID\": \"a1b2c3d4-0000-0000-0000-000000000000\",\n  \"status\": 1\n}\"\"\"\n\n# Authorization: HMAC-SHA256 over the exact body bytes,\n# keyed by the raw SHA-256 digest of the API key\nkey = hashlib.sha256(VENDOR_API_KEY.encode()).digest()\nauthorization = hmac.new(key, body.encode('utf-8'), hashlib.sha256).hexdigest()\n\nresponse = requests.post(\n    URL,\n    headers={'Content-Type': 'application/json',\n             'Authorization': authorization},\n    data=body.encode('utf-8'),\n    timeout=30,\n)\n\nprint(response.status_code, response.text)\n"
        - language: node
          name: Node.js
          code: "const crypto = require('crypto');\n\nconst VENDOR_API_KEY = 'xxx';\nconst URL = 'https://api.sandbox.evrotrust.com/vendor/certificate/hash/offline/ready';\n\nconst body = JSON.stringify({\n  \"transactionID\": \"a1b2c3d4-0000-0000-0000-000000000000\",\n  \"status\": 1\n});\n\n// Authorization: HMAC-SHA256 over the body, keyed by the raw SHA-256 of the API key\nconst key = crypto.createHash('sha256').update(VENDOR_API_KEY).digest();\nconst authorization = crypto.createHmac('sha256', key).update(body).digest('hex');\n\nconst response = await fetch(URL, {\n  method: 'POST',\n  headers: {\n    'Content-Type': 'application/json',\n    Authorization: authorization,\n  },\n  body,\n});\n\nconsole.log(response.status, await response.text());\n"
  /document/group/offline/ready:
    post:
      tags:
      - e-Signatures
      summary: One-time Signing Document Group Ready
      description: 'Shows the one-time sign document group status. The callback is triggered on Signed, Rejected, Expired, Failed and Withdrawn statuses.


        "status": 1 - Pending, 2 - Signed, 3 - Rejected, 4 - Expired, 5 - Failed, 6 - Withdrawn, 7 - Undeliverable, 8 - Failed face recognition, 99 - On hold.

        "automatedSignError": Optional. May present if the agent document has to be signed automatically and the status is Failed.'
      operationId: readyGroupOfflineDocument
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DataDocumentGroupOfflineReady'
            examples:
              default:
                summary: Example request
                value:
                  transactionID: a1b2c3d4-0000-0000-0000-000000000000
                  status: 1
                  automatedSignError: <automatedSignError>
        description: Document info
        required: true
      responses:
        '204':
          description: Success
      x-readme:
        code-samples:
        - language: python
          name: Python
          code: "import hashlib, hmac, requests\n\nVENDOR_API_KEY = 'xxx'\nURL = 'https://api.sandbox.evrotrust.com/vendor/document/group/offline/ready'\n\nbody = \"\"\"{\n  \"transactionID\": \"a1b2c3d4-0000-0000-0000-000000000000\",\n  \"status\": 1,\n  \"automatedSignError\": \"<automatedSignError>\"\n}\"\"\"\n\n# Authorization: HMAC-SHA256 over the exact body bytes,\n# keyed by the raw SHA-256 digest of the API key\nkey = hashlib.sha256(VENDOR_API_KEY.encode()).digest()\nauthorization = hmac.new(key, body.encode('utf-8'), hashlib.sha256).hexdigest()\n\nresponse = requests.post(\n    URL,\n    headers={'Content-Type': 'application/json',\n             'Authorization': authorization},\n    data=body.encode('utf-8'),\n    timeout=30,\n)\n\nprint(response.status_code, response.text)\n"
        - language: node
          name: Node.js
          code: "const crypto = require('crypto');\n\nconst VENDOR_API_KEY = 'xxx';\nconst URL = 'https://api.sandbox.evrotrust.com/vendor/document/group/offline/ready';\n\nconst body = JSON.stringify({\n  \"transactionID\": \"a1b2c3d4-0000-0000-0000-000000000000\",\n  \"status\": 1,\n  \"automatedSignError\": \"<automatedSignError>\"\n});\n\n// Authorization: HMAC-SHA256 over the body, keyed by the raw SHA-256 of the API key\nconst key = crypto.createHash('sha256').update(VENDOR_API_KEY).digest();\nconst authorization = crypto.createHmac('sha256', key).update(body).digest('hex');\n\nconst response = await fetch(URL, {\n  method: 'POST',\n  headers: {\n    'Content-Type': 'application/json',\n    Authorization: authorization,\n  },\n  body,\n});\n\nconsole.log(response.status, await response.text());\n"
  /document/group/ready:
    post:
      tags:
      - e-Signatures
      summary: Document Group Ready
      description: 'Shows the document group status. The callback is triggered on Signed, Rejected, Expired, Failed, Withdrawn and Failed face recognition statuses.


        "status": 1 - Pending, 2 - Signed, 3 - Rejected, 4 - Expired, 5 - Failed, 6 - Withdrawn, 7 - Undeliverable, 8 - Failed face recognition, 99 - On hold.

        "statusLpis": Optional. It is only for documents type lpis.

        "rejectReason": Optional. May present if the status is Rejected.

        "automatedSignError": Optional. May present if the document has to be signed automatically and the status is Failed.'
      operationId: readyGroupDocument
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DataDocumentGroupReady'
            examples:
              default:
                summary: Example request
                value:
                  transactionID: a1b2c3d4-0000-0000-0000-000000000000
                  status: 1
                  statusLpis: <statusLpis>
                  rejectReason: <rejectReason>
                  automatedSignError: <automatedSignError>
        description: Document info
        required: true
      responses:
        '204':
          description: Success
      x-readme:
        code-samples:
        - language: python
          name: Python
          code: "import hashlib, hmac, requests\n\nVENDOR_API_KEY = 'xxx'\nURL = 'https://api.sandbox.evrotrust.com/vendor/document/group/ready'\n\nbody = \"\"\"{\n  \"transactionID\": \"a1b2c3d4-0000-0000-0000-000000000000\",\n  \"status\": 1,\n  \"statusLpis\": \"<statusLpis>\",\n  \"rejectReason\": \"<rejectReason>\",\n  \"automatedSignError\": \"<automatedSignError>\"\n}\"\"\"\n\n# Authorization: HMAC-SHA256 over the exact body bytes,\n# keyed by the raw SHA-256 digest of the API key\nkey = hashlib.sha256(VENDOR_API_KEY.encode()).digest()\nauthorization = hmac.new(key, body.encode('utf-8'), hashlib.sha256).hexdigest()\n\nresponse = requests.post(\n    URL,\n    headers={'Content-Type': 'application/json',\n             'Authorization': authorization},\n    data=body.encode('utf-8'),\n    timeout=30,\n)\n\nprint(response.status_code, response.text)\n"
        - language: node
          name: Node.js
          code: "const crypto = require('crypto');\n\nconst VENDOR_API_KEY = 'xxx';\nconst URL = 'https://api.sandbox.evrotrust.com/vendor/document/group/ready';\n\nconst body = JSON.stringify({\n  \"transactionID\": \"a1b2c3d4-0000-0000-0000-000000000000\",\n  \"status\": 1,\n  \"statusLpis\": \"<statusLpis>\",\n  \"rejectReason\": \"<rejectReason>\",\n  \"automatedSignError\": \"<automatedSignError>\"\n});\n\n// Authorization: HMAC-SHA256 over the body, keyed by the raw SHA-256 of the API key\nconst key = crypto.createHash('sha256').update(VENDOR_API_KEY).digest();\nconst authorization = crypto.createHmac('sha256', key).update(body).digest('hex');\n\nconst response = await fetch(URL, {\n  method: 'POST',\n  headers: {\n    'Content-Type': 'application/json',\n    Authorization: authorization,\n  },\n  body,\n});\n\nconsole.log(response.status, await response.text());\n"
