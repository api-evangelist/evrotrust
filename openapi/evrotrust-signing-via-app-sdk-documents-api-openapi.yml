      x-readme:
        code-samples:
        - language: python
          name: Python
          code: "import hashlib, hmac, requests\n\nVENDOR_API_KEY = 'xxx'\nURL = 'https://api.sandbox.evrotrust.com/vendor/document/group/online'\n\n# The HMAC is computed over this exact string, so build it once and reuse it.\n# Each file is sent as a separate `document` part, in the SAME ORDER as the\n# entries in data['documents'].\ndata = \"\"\"{\n  \"documents\": [\n    {\n      \"description\": \"Service agreement\",\n      \"optional\": 0,\n      \"preview\": 0,\n      \"checksumDocument\": \"9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08\",\n      \"annotationParameters\": [\n        {\n          \"annotationText\": \"Signed by Evrotrust\",\n          \"fontName\": \"Helvetica\",\n          \"fontSize\": 10,\n          \"fontColor\": \"#000000\",\n          \"axisX\": 100,\n          \"axisY\": 150,\n          \"page\": 1\n        }\n      ]\n    },\n    {\n      \"description\": \"Annex A - pricing\",\n      \"optional\": 1,\n      \"preview\": 0,\n      \"checksumDocument\": \"60303ae22b998861bce3b28f33eec1be758a213c86c93c076dbe9f558c11c752\",\n      \"annotationParameters\": [\n        {\n          \"annotationText\": \"Signed by Evrotrust\",\n          \"fontName\": \"Helvetica\",\n          \"fontSize\": 10,\n          \"fontColor\": \"#000000\",\n          \"axisX\": 100,\n          \"axisY\": 150,\n          \"page\": 1\n        }\n      ]\n    }\n  ],\n  \"signInfo\": { \"type\": \"PDF2\", \"algorithm\": \"SHA256\" },\n  \"groupDescription\": \"Service agreement and annex\",\n  \"certificateType\": 1,\n  \"coverage\": 20000,\n  \"dateExpire\": 1798761599,\n  \"BIOrequired\": 0,\n  \"urlCallback\": \"https://your-server.example.com/evrotrust/callback\",\n  \"vendorNumber\": \"YOUR_VENDOR_NUMBER\",\n  \"users\": [\n    {\n      \"identificationNumber\": \"1234567890\",\n      \"country\": \"BG\",\n      //\"email\": \"user@example.com\",\n      //\"phone\": \"+359123456789\",\n\t\t\t//\"automatedSignCertID\": \"string\",\n\t\t\t//\"automatedSignSealID\": \"string\",\n      \"employee\": 0,\n      },\n  ],\n  \"publicKey\": \"BASE64_ENCODED_PUBLIC_KEY\"\n}\"\"\"\n\nkey = hashlib.sha256(VENDOR_API_KEY.encode()).digest()\nauthorization = hmac.new(key, data.encode('utf-8'), hashlib.sha256).hexdigest()\n\npaths = ['/path/to/agreement.pdf', '/path/to/annex-a.pdf']\nhandles = [open(p, 'rb') for p in paths]\ntry:\n    files = [('document', (p.split('/')[-1], fh, 'application/pdf'))\n             for p, fh in zip(paths, handles)]\n    response = requests.post(\n        URL,\n        headers={'Authorization': authorization},\n        data={'data': data},\n        files=files,\n        timeout=60,\n    )\nfinally:\n    for fh in handles:\n        fh.close()\n\nprint(response.status_code, response.text)\n"
        - language: node
          name: Node.js
          code: "const crypto = require('crypto');\nconst fs = require('fs');\n\nconst VENDOR_API_KEY = 'xxx';\nconst URL = 'https://api.sandbox.evrotrust.com/vendor/document/group/online';\n\n// The HMAC covers this exact string, so sign the same value that is sent.\n// Append one `document` part per entry in data.documents, in the SAME ORDER.\nconst data = JSON.stringify({\n  \"documents\": [\n    {\n      \"description\": \"Service agreement\",\n      \"optional\": 0,\n      \"preview\": 0,\n      \"checksumDocument\": \"9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08\",\n      \"annotationParameters\": [\n        {\n          \"annotationText\": \"Signed by Evrotrust\",\n          \"fontName\": \"Helvetica\",\n          \"fontSize\": 10,\n          \"fontColor\": \"#000000\",\n          \"axisX\": 100,\n          \"axisY\": 150,\n          \"page\": 1\n        }\n      ]\n    },\n    {\n      \"description\": \"Annex A - pricing\",\n      \"optional\": 1,\n      \"preview\": 0,\n      \"checksumDocument\": \"60303ae22b998861bce3b28f33eec1be758a213c86c93c076dbe9f558c11c752\",\n      \"annotationParameters\": [\n        {\n          \"annotationText\": \"Signed by Evrotrust\",\n          \"fontName\": \"Helvetica\",\n          \"fontSize\": 10,\n          \"fontColor\": \"#000000\",\n          \"axisX\": 100,\n          \"axisY\": 150,\n          \"page\": 1\n        }\n      ]\n    }\n  ],\n  \"signInfo\": {\n    \"type\": \"PDF2\",\n    \"algorithm\": \"SHA256\"\n  },\n  \"groupDescription\": \"Service agreement and annex\",\n  \"certificateType\": 1,\n  \"coverage\": 20000,\n  \"dateExpire\": 1798761599,\n  \"BIOrequired\": 0,\n  \"urlCallback\": \"https://your-server.example.com/evrotrust/callback\",\n  \"vendorNumber\": \"YOUR_VENDOR_NUMBER\",\n  \"users\": [\n    \"users\": [\n    {\n      \"identificationNumber\": \"1234567890\",\n      \"country\": \"BG\",\n      //\"email\": \"user@example.com\",\n      //\"phone\": \"+359123456789\",\n\t\t\t//\"automatedSignCertID\": \"string\",\n\t\t\t//\"automatedSignSealID\": \"string\",\n      \"employee\": 0,\n      },\n  ],\n  \"publicKey\": \"BASE64_ENCODED_PUBLIC_KEY\"\n});\n\nconst key = crypto.createHash('sha256').update(VENDOR_API_KEY).digest();\nconst authorization = crypto.createHmac('sha256', key).update(data).digest('hex');\n\nconst files = ['/path/to/agreement.pdf', '/path/to/annex-a.pdf'];\n\nconst form = new FormData();\nform.append('data', data);\nfor (const file of files) {\n  form.append(\n    'document',\n    new Blob([fs.readFileSync(file)], { type: 'application/pdf' }),\n    file.split('/').pop()\n  );\n}\n\nconst response = await fetch(URL, {\n  method: 'POST',\n  headers: { Authorization: authorization },\n  body: form,\n});\n\nconsole.log(response.status, await response.text());"
