info:
  description: This is Evrotrust Vendor callback server API
  version: 1.0.22
  title: Evrotrust Signing via App/SDK (Documents) API
  contact:
    name: Evrotrust
    email: technical_support@evrotrust.com
servers:
- url: https://api.sandbox.evrotrust.com/vendor
  description: Testing
- url: https://v.evrotrust.com/vendor
  description: Production
tags:
- name: Signing via App/SDK (Documents)
paths:
  /document/doc/online:
    post:
      description: /document/doc/online
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                    description: 'Only 1 user identifier that is sent in the request will be returned below:

                      {

                      "transactionID":"string",

                      "threadID":"string",

                      "transactions": [{

                      "transactionID":"string",

                      "identificationNumber":"string",

                      "country": 0,

                      "email":"string",

                      "phone":"string",

                      "automatedSignCertID":"string",

                      "automatedSignSealID":"string"

                      }]

                      }'
                required:
                - name
        '400':
          description: Invalid data supplied
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                required:
                - name
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                required:
                - name
        '438':
          description: User not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                required:
                - name
        '450':
          description: File exceeds max allowed file size
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                required:
                - name
        '454':
          description: Incorrect coverage
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                required:
                - name
        '457':
          description: Not supported file types
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                required:
                - name
      parameters:
      - in: header
        name: Authorization
        schema:
          type: string
        required: true
        description: See Authorization Header page for more info
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                document:
                  type: string
                  description: ''
                  format: binary
                data:
                  type: string
                  description: 'JSON string containing document metadata, signing configuration, and user information. See the example for the complete structure.


                    {

                    "document": {

                    "description": "string",

                    "dateExpire": 0,

                    "certificateType": 0,

                    "coverage": 0,

                    "preview": 0,

                    "checksumDocument": "string",

                    "annotationParameters": [{

                    "annotationText": "string",

                    "fontName": "string",

                    "fontSize": "integer",

                    "fontColor": "string",

                    "axisX": "integer",

                    "axisY": "integer",

                    "page": "integer"

                    }]

                    },

                    "signInfo": {

                    "type": "string",

                    "algorithm": "string"

                    },

                    "BIOrequired": 0,

                    "urlCallback": "string",

                    "vendorNumber": "string",

                    "users": [{

                    "identificationNumber": "string",

                    "country": "string",

                    "email": "string",

                    "phone": "string",

                    "automatedSignCertID": "string",

                    "automatedSignSealID": "string",

                    "employee": 0}] ,

                    "publicKey": "string"

                    }'
                  format: json
              required:
              - document
              - data
      summary: eSign Single File
      operationId: post_document-doc-online
      tags:
      - Signing via App/SDK (Documents)
      x-readme:
        code-samples:
        - language: python
          name: Python
          code: "import hashlib, hmac, requests\n\nVENDOR_API_KEY = 'xxx'\nURL = 'https://api.sandbox.evrotrust.com/vendor/document/doc/online'\n\n# This is the `data` part. The HMAC is computed over this exact string,\n# so build it once and reuse it -- re-serialising can change key order\n# or spacing and produce a 401.\ndata = \"\"\"{\n  \"document\": {\n    \"description\": \"Service agreement for signature\",\n    \"dateExpire\": 1767225599,\n    \"certificateType\": 1,\n    \"coverage\": 20000,\n    \"preview\": 0,\n    \"checksumDocument\": \"9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08\",\n    \"annotationParameters\": [\n      {\n        \"annotationText\": \"Signed by Evrotrust\",\n        \"fontName\": \"Helvetica\",\n        \"fontSize\": 10,\n        \"fontColor\": \"#000000\",\n        \"axisX\": 100,\n        \"axisY\": 150,\n        \"page\": 1\n      }\n    ]\n  },\n  \"signInfo\": {\n    \"type\": \"PDF2\",\n    \"algorithm\": \"SHA256\"\n  },\n  \"BIOrequired\": 0,\n  \"urlCallback\": \"https://your-server.example.com/evrotrust/callback\",\n  \"vendorNumber\": \"YOUR_VENDOR_NUMBER\",\n  \"users\": [\n    {\n      \"identificationNumber\": \"1234567890\",\n      \"country\": \"BG\",\n      //\"email\": \"user@example.com\",\n      //\"phone\": \"+359123456789\",\n\t\t\t//\"automatedSignCertID\": \"string\",\n\t\t\t//\"automatedSignSealID\": \"string\",\n      \"employee\": 0,\n      },\n\t\"publicKey\": \"BASE64_ENCODED_PUBLIC_KEY\"\n  ]\n}\"\"\"\n\nkey = hashlib.sha256(VENDOR_API_KEY.encode()).digest()\nauthorization = hmac.new(key, data.encode('utf-8'), hashlib.sha256).hexdigest()\n\nwith open('/path/to/contract.pdf', 'rb') as fh:\n    response = requests.post(\n        URL,\n        headers={'Authorization': authorization},\n        data={'data': data},\n        files={'document': ('contract.pdf', fh, 'application/pdf')},\n        timeout=30,\n    )\n\nprint(response.status_code, response.text)"
        - language: node
          name: Node.js
          code: "const crypto = require('crypto');\nconst fs = require('fs');\n\nconst VENDOR_API_KEY = 'xxx';\nconst URL = 'https://api.sandbox.evrotrust.com/vendor/document/doc/online';\n\n// The HMAC covers this exact string, so sign the same value that is sent.\nconst data = JSON.stringify({\n  \"document\": {\n    \"description\": \"Service agreement for signature\",\n    \"dateExpire\": 1767225599,\n    \"certificateType\": 1,\n    \"coverage\": 20000,\n    \"preview\": 0,\n    \"checksumDocument\": \"9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08\",\n    \"annotationParameters\": [\n      {\n        \"annotationText\": \"Signed by Evrotrust\",\n        \"fontName\": \"Helvetica\",\n        \"fontSize\": 10,\n        \"fontColor\": \"#000000\",\n        \"axisX\": 100,\n        \"axisY\": 150,\n        \"page\": 1\n      }\n    ]\n  },\n  \"signInfo\": { \"type\": \"PDF2\", \"algorithm\": \"SHA256\" },\n  \"BIOrequired\": 0,\n  \"urlCallback\": \"https://your-server.example.com/evrotrust/callback\",\n  \"vendorNumber\": \"YOUR_VENDOR_NUMBER\",\n  \"users\": [\n    {\n      \"identificationNumber\": \"1234567890\",\n      \"country\": \"BG\",\n      //\"email\": \"user@example.com\",\n      //\"phone\": \"+359123456789\",\n\t\t\t//\"automatedSignCertID\": \"string\",\n\t\t\t//\"automatedSignSealID\": \"string\",\n      \"employee\": 0,\n      },\n\t\"publicKey\": \"BASE64_ENCODED_PUBLIC_KEY\"\n  ]\n});\n\nconst key = crypto.createHash('sha256').update(VENDOR_API_KEY).digest();\nconst authorization = crypto.createHmac('sha256', key).update(data).digest('hex');\n\nconst form = new FormData();\nform.append('data', data);\nform.append(\n  'document',\n  new Blob([fs.readFileSync('/path/to/contract.pdf')], { type: 'application/pdf' }),\n  'contract.pdf'\n);\n\nconst response = await fetch(URL, {\n  method: 'POST',\n  headers: { Authorization: authorization },\n  body: form,\n});\n\nconsole.log(response.status, await response.text());\n"
