openapi: 3.2.0
info:
  description: This is Evrotrust Vendor callback server API
  version: 1.0.22
  title: Evrotrust eID (Registered Users) API
  contact:
    name: Evrotrust
    email: technical_support@evrotrust.com
servers:
- url: https://api.sandbox.evrotrust.com/vendor
  description: Testing
- url: https://v.evrotrust.com/vendor
  description: Production
tags:
- name: Evrotrust eID (Registered Users)
paths:
  /document/doc/identification:
    post:
      description: /document/doc/identification
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                    description: '{

                      "transactionID":"string",

                      "threadID":"string"

                      }'
        '400':
          description: Invalid data supplied
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                required:
                - name
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                required:
                - name
        '438':
          description: User not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                required:
                - name
        '449':
          description: User data is not valid
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                    description: 'Note: In case response is 449 (User data is not valid). This means that ID document of the user is either expired, or lost, stolen. User needs to update his profile in Evrotrust app with valid ID document or within mobile SDK using method edit profile.'
        '469':
          description: Request cannot be processed. Register check not successful.
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                required:
                - name
      parameters:
      - in: header
        name: Authorization
        schema:
          type: string
        required: true
        description: Authorization value.
      summary: eID Get User Data
      operationId: post_document-doc-identification
      tags:
      - Evrotrust eID (Registered Users)
      x-readme:
        code-samples:
        - language: python
          name: Python
          code: "import hashlib, hmac, requests\n\nVENDOR_API_KEY = 'xxx'\nURL = 'https://api.sandbox.evrotrust.com/vendor/document/doc/identification'\n\nbody = \"\"\"{\n\"document\": {\n\t\t\"dateExpire\": 1791915628,\n    \"language\":\"en\"},\n  \"includes\": {\n    \"names\": true,\n    \"latinNames\": true,\n    \"emails\": true,\n    \"phones\": true,\n    \"address\": true,\n    \"documentType\": true,\n    \"documentNumber\": true,\n    \"documentIssuerName\": true,\n    \"documentValidDate\": true,\n    \"documentIssueDate\": true,\n    \"documentCountry\": true,\n    \"identificationNumber\": true,\n    \"gender\": true,\n    \"nationality\": true,\n    \"documentPicture\": true,\n    \"documentSignature\": true,\n    \"picFront\": true,\n    \"picBack\": true,\n    \"picIDCombined\": true,\n    \"dateOfBirth\": true,\n    \"placeOfBirth\": true\n  },\n  \"identificationReason\": \"<identificationReason>\",\n  \"signInfo\": {\n    \"algorithm\": \"<algorithm>\"\n  },\n  \"user\": {\n    \"identificationNumber\": \"1234567890\",\n    \"country\": \"BG\",\n    \"email\": \"user@example.com\",\n    \"phone\": \"+359123456789\"\n  },\n  \"BIOrequired\": 1.0,\n  \"vendorNumber\": \"YOUR_VENDOR_NUMBER\",\n  \"urlCallback\": \"https://your-server.example.com/callback\",\n  \"publicKey\": \"<publicKey>\"\n}\"\"\"\n\n# Authorization: HMAC-SHA256 over the exact body bytes,\n# keyed by the raw SHA-256 digest of the API key\nkey = hashlib.sha256(VENDOR_API_KEY.encode()).digest()\nauthorization = hmac.new(key, body.encode('utf-8'), hashlib.sha256).hexdigest()\n\nresponse = requests.post(\n    URL,\n    headers={'Content-Type': 'application/json',\n             'Authorization': authorization},\n    data=body.encode('utf-8'),\n    timeout=30,\n)\n\nprint(response.status_code, response.text)\n"
        - language: node
          name: Node.js
          code: "const crypto = require('crypto');\n\nconst VENDOR_API_KEY = 'xxx';\nconst URL = 'https://api.sandbox.evrotrust.com/vendor/document/doc/identification';\n\nconst body = JSON.stringify({\n  \"document\": {\n\t\t\"dateExpire\": 1791915628,\n    \"language\":\"en\"},\n  \"includes\": {\n    \"names\": true,\n    \"latinNames\": true,\n    \"emails\": true,\n    \"phones\": true,\n    \"address\": true,\n    \"documentType\": true,\n    \"documentNumber\": true,\n    \"documentIssuerName\": true,\n    \"documentValidDate\": true,\n    \"documentIssueDate\": true,\n    \"documentCountry\": true,\n    \"identificationNumber\": true,\n    \"gender\": true,\n    \"nationality\": true,\n    \"documentPicture\": true,\n    \"documentSignature\": true,\n    \"picFront\": true,\n    \"picBack\": true,\n    \"picIDCombined\": true,\n    \"dateOfBirth\": true,\n    \"placeOfBirth\": true\n  },\n  \"identificationReason\": \"<identificationReason>\",\n  \"signInfo\": {\n    \"algorithm\": \"<algorithm>\"\n  },\n  \"user\": {\n    \"identificationNumber\": \"1234567890\",\n    \"country\": \"BG\",\n    //\"email\": \"user@example.com\",\n    //\"phone\": \"+359123456789\",\n\t\t//\"refID\":\"\"\n  },\n  \"BIOrequired\": 1.0,\n  \"vendorNumber\": \"YOUR_VENDOR_NUMBER\",\n  \"urlCallback\": \"https://your-server.example.com/callback\",\n  \"publicKey\": \"<publicKey>\"\n});\n\n// Authorization: HMAC-SHA256 over the body, keyed by the raw SHA-256 of the API key\nconst key = crypto.createHash('sha256').update(VENDOR_API_KEY).digest();\nconst authorization = crypto.createHmac('sha256', key).update(body).digest('hex');\n\nconst response = await fetch(URL, {\n  method: 'POST',\n  headers: {\n    'Content-Type': 'application/json',\n    Authorization: authorization,\n  },\n  body,\n});\n\nconsole.log(response.status, await response.text());\n"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: "{\n  \"document\": {\n    \"dateExpire\":,\n    \"language\":\"\"},\n  \"includes\": {\n    \"names\": true,\n    \"latinNames\": true,\n    \"emails\": true,\n    \"phones\": true,\n    \"address\": true,\n    \"documentType\": true,\n    \"documentNumber\": true,\n    \"documentIssuerName\": true,\n    \"documentValidDate\": true,\n    \"documentIssueDate\": true,\n    \"documentCountry\": true,\n    \"identificationNumber\": true,\n    \"gender\": true,\n    \"nationality\": true,\n    \"documentPicture\": true,\n    \"documentSignature\": true,\n    \"picFront\": true,\n    \"picBack\": true,\n    \"picIDCombined\": true,\n    \"dateOfBirth\": true,\n    \"placeOfBirth\": true\n  },\n  \"identificationReason\": \"<identificationReason>\",\n  \"signInfo\": {\n    \"algorithm\": \"SHA256\"\n  },\n  \"user\": {\n    \"identificationNumber\": \"\",\n    \"country\": \"\",\n    //\"email\": \"user@example.com\",\n    //\"phone\": \"+359123456789\",\n   //\"refID\":\"\"\n  },\n  \"BIOrequired\": 0,\n  \"vendorNumber\": \"YOUR_VENDOR_NUMBER\",\n  \"urlCallback\": \"https://your-server.example.com/callback\",\n  \"publicKey\": \"<publicKey>\"\n}"
              required:
              - name
  /document/doc/identification/lpis:
    post:
      description: ''
      responses:
        '200':
          description: Document added success
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                required:
                - name
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                required:
                - name
        '438':
          description: User not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                required:
                - name
        '449':
          description: User data is not valid
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                required:
                - name
        '454':
          description: Incorrect coverage
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                required:
                - name
        '469':
          description: Request cannot be processed. Register check not successful.
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                required:
                - name
      parameters:
      - in: header
        name: Authorization
        schema:
          type: string
        required: true
        description: Authorization value.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                document:
                  type: object
                  properties: {}
                  description: '"dateExpire": timestamp'
                includes:
                  type: object
                  properties:
                    names:
                      type: boolean
                    latinNames:
                      type: boolean
                    emails:
                      type: boolean
                    phones:
                      type: boolean
                    address:
                      type: boolean
                    documentType:
                      type: boolean
                    documentNumber:
                      type: boolean
                    documentIssuerName:
                      type: boolean
                    documentValidDate:
                      type: boolean
                    documentIssueDate:
                      type: boolean
                    documentCountry:
                      type: boolean
                    identificationNumber:
                      type: boolean
                    gender:
                      type: boolean
                    nationality:
                      type: boolean
                    documentPicture:
                      type: boolean
                    documentSignature:
                      type: boolean
                    picFront:
                      type: boolean
                    picBack:
                      type: boolean
                    picIDCombined:
                      type: boolean
                    dateOfBirth:
                      type: boolean
                    placeOfBirth:
                      type: boolean
                  description: These parameters specify which user data to be returned in the response.
                identificationReason:
                  type: string
                  description: Field limit of 90 characters
                signInfo:
                  type: object
                  properties:
                    algorithm:
                      type: string
                      description: '"SHA256"'
                BIOrequired:
                  type: number
                  description: Optional parameter. Default value 0. Activated upon request as a service. When required user confirms the request with face recognition.
                user:
                  type: object
                  properties:
                    identificationNumber:
                      type: string
                      description: Personal identification number.
                    country:
                      type: string
                      description: This parameter will be used only if "identificationNumber" is sent. Valid values are the ISO 3166-1 alpha-2 codes. It is optional parameter and if it is not send, the default value will be applied which is "BG".
                    email:
                      type: string
                    phone:
                      type: string
                  description: Only one of the parameters has to be sent.
                companyInfo:
                  type: object
                  properties:
                    country:
                      type: string
                      description: Valid values are the ISO 3166-1 alpha-2 codes.
                    companyUniqueId:
                      type: string
                      description: Accepts valid UIC Bulgaria, used to get information about the company
                vendorNumber:
                  type: string
                urlCallback:
                  type: string
                publicKey:
                  type: string
                  description: Base64 encoded string of public key, necessary for encryption process.
              required:
              - vendorNumber
              - user
            examples:
              default:
                summary: Example request
                value:
                  document: {}
                  includes:
                    names: true
                    latinNames: true
                    emails: user@example.com
                    phones: '+359123456789'
                    address: true
                    documentType: true
                    documentNumber: true
                    documentIssuerName: true
                    documentValidDate: true
                    documentIssueDate: true
                    documentCountry: BG
                    identificationNumber: '1234567890'
                    gender: true
                    nationality: true
                    documentPicture: true
                    documentSignature: true
                    picFront: true
                    picBack: true
                    picIDCombined: true
                    dateOfBirth: true
                    placeOfBirth: true
                  identificationReason: <identificationReason>
                  signInfo:
                    algorithm: <algorithm>
                  BIOrequired: 1
                  user:
                    identificationNumber: '1234567890'
                    country: BG
                    email: user@example.com
                    phone: '+359123456789'
                  companyInfo:
                    country: BG
                    companyUniqueId: <companyUniqueId>
                  vendorNumber: YOUR_VENDOR_NUMBER
                  urlCallback: https://your-server.example.com/callback
                  publicKey: <publicKey>
      summary: eID (Legal Entities)
      x-readme:
        code-samples:
        - language: python
          name: Python
          code: "import hashlib, hmac, requests\n\nVENDOR_API_KEY = 'xxx'\nURL = 'https://api.sandbox.evrotrust.com/vendor/document/doc/identification/lpis'\n\nbody = \"\"\"{\n  \"document\": {},\n  \"includes\": {\n    \"names\": true,\n    \"latinNames\": true,\n    \"emails\": true,\n    \"phones\": true,\n    \"address\": true,\n    \"documentType\": true,\n    \"documentNumber\": true,\n    \"documentIssuerName\": true,\n    \"documentValidDate\": true,\n    \"documentIssueDate\": true,\n    \"documentCountry\": true,\n    \"identificationNumber\": true,\n    \"gender\": true,\n    \"nationality\": true,\n    \"documentPicture\": true,\n    \"documentSignature\": true,\n    \"picFront\": true,\n    \"picBack\": true,\n    \"picIDCombined\": true,\n    \"dateOfBirth\": true,\n    \"placeOfBirth\": true\n  },\n  \"identificationReason\": \"<identificationReason>\",\n  \"signInfo\": {\n    \"algorithm\": \"<algorithm>\"\n  },\n  \"BIOrequired\": 1.0,\n  \"user\": {\n    \"identificationNumber\": \"1234567890\",\n    \"country\": \"BG\",\n    //\"email\": \"user@example.com\",\n    //\"phone\": \"+359123456789\"\n  },\n  \"companyInfo\": {\n    \"country\": \"BG\",\n    \"companyUniqueId\": \"<companyUniqueId>\"\n  },\n  \"vendorNumber\": \"YOUR_VENDOR_NUMBER\",\n  \"urlCallback\": \"https://your-server.example.com/callback\",\n  \"publicKey\": \"<publicKey>\"\n}\"\"\"\n\n# Authorization: HMAC-SHA256 over the exact body bytes,\n# keyed by the raw SHA-256 digest of the API key\nkey = hashlib.sha256(VENDOR_API_KEY.encode()).digest()\nauthorization = hmac.new(key, body.encode('utf-8'), hashlib.sha256).hexdigest()\n\nresponse = requests.post(\n    URL,\n    headers={'Content-Type': 'application/json',\n             'Authorization': authorization},\n    data=body.encode('utf-8'),\n    timeout=30,\n)\n\nprint(response.status_code, response.text)\n"
        - language: node
          name: Node.js
          code: "const crypto = require('crypto');\n\nconst VENDOR_API_KEY = 'xxx';\nconst URL = 'https://api.sandbox.evrotrust.com/vendor/document/doc/identification/lpis';\n\nconst body = JSON.stringify({\n  \"document\": {},\n  \"includes\": {\n    \"names\": true,\n    \"latinNames\": true,\n    \"emails\": true,\n    \"phones\": true,\n    \"address\": true,\n    \"documentType\": true,\n    \"documentNumber\": true,\n    \"documentIssuerName\": true,\n    \"documentValidDate\": true,\n    \"documentIssueDate\": true,\n    \"documentCountry\": true,\n    \"identificationNumber\": true,\n    \"gender\": true,\n    \"nationality\": true,\n    \"documentPicture\": true,\n    \"documentSignature\": true,\n    \"picFront\": true,\n    \"picBack\": true,\n    \"picIDCombined\": true,\n    \"dateOfBirth\": true,\n    \"placeOfBirth\": true\n  },\n  \"identificationReason\": \"<identificationReason>\",\n  \"signInfo\": {\n    \"algorithm\": \"<algorithm>\"\n  },\n  \"BIOrequired\": 1.0,\n  \"user\": {\n    \"identificationNumber\": \"1234567890\",\n    \"country\": \"BG\",\n    \"email\": \"user@example.com\",\n    \"phone\": \"+359123456789\"\n  },\n  \"companyInfo\": {\n    \"country\": \"BG\",\n    \"companyUniqueId\": \"<companyUniqueId>\"\n  },\n  \"vendorNumber\": \"YOUR_VENDOR_NUMBER\",\n  \"urlCallback\": \"https://your-server.example.com/callback\",\n  \"publicKey\": \"<publicKey>\"\n});\n\n// Authorization: HMAC-SHA256 over the body, keyed by the raw SHA-256 of the API key\nconst key = crypto.createHash('sha256').update(VENDOR_API_KEY).digest();\nconst authorization = crypto.createHmac('sha256', key).update(body).digest('hex');\n\nconst response = await fetch(URL, {\n  method: 'POST',\n  headers: {\n    'Content-Type': 'application/json',\n    Authorization: authorization,\n  },\n  body,\n});\n\nconsole.log(response.status, await response.text());\n"
      operationId: post_document-doc-identification-lpis
      tags:
      - Evrotrust eID (Registered Users)
  /user/certificate/get:
    post:
      description: /user/certificate/get
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                    description: '{

                      "automatedSealID":"string",

                      "automatedCertID":"string",

                      "serialNumber":"string",

                      "type": 0,

                      "certificate":"string",

                      "coverage": 0,

                      "dateValidTo": 0

                      }'
                required:
                - name
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                required:
                - name
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                required:
                - name
        '438':
          description: User not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                required:
                - name
      parameters:
      - in: header
        name: Authorization
        schema:
          type: string
        required: true
        description: Authorization value.
      summary: Get Certificate
      operationId: post_user-certificate-get
      x-readme:
        code-samples:
        - language: python
          name: Python
          code: "import hashlib, hmac, requests\n\nVENDOR_API_KEY = 'xxx'\nURL = 'https://api.sandbox.evrotrust.com/vendor/user/certificate/get'\n\nbody = \"\"\"{\n  \"vendorNumber\": \"YOUR_VENDOR_NUMBER\",\n  \"user\": {\n    \"identificationNumber\": \"1234567890\",\n    \"country\": \"BG\",\n    \"email\": \"user@example.com\",\n    \"phone\": \"+359123456789\"\n  },\n  \"certificate\": {\n    \"coverage\": 20000,\n    \"isPidIncluded\": false,\n    \"type\": 1\n  }\n}\"\"\"\n\n# Authorization: HMAC-SHA256 over the exact body bytes,\n# keyed by the raw SHA-256 digest of the API key\nkey = hashlib.sha256(VENDOR_API_KEY.encode()).digest()\nauthorization = hmac.new(key, body.encode('utf-8'), hashlib.sha256).hexdigest()\n\nresponse = requests.post(\n    URL,\n    headers={'Content-Type': 'application/json',\n             'Authorization': authorization},\n    data=body.encode('utf-8'),\n    timeout=30,\n)\n\nprint(response.status_code, response.text)\n"
        - language: node
          name: Node.js
          code: "const crypto = require('crypto');\n\nconst VENDOR_API_KEY = 'xxx';\nconst URL = 'https://api.sandbox.evrotrust.com/vendor/user/certificate/get';\n\nconst body = JSON.stringify({\n  \"vendorNumber\": \"YOUR_VENDOR_NUMBER\",\n  \"user\": {\n    \"identificationNumber\": \"1234567890\",\n    \"country\": \"BG\",\n    \"email\": \"user@example.com\",\n    \"phone\": \"+359123456789\"\n  },\n  \"certificate\": {\n    \"coverage\": 20000,\n    \"isPidIncluded\": false,\n    \"type\": 1\n  }\n});\n\n// Authorization: HMAC-SHA256 over the body, keyed by the raw SHA-256 of the API key\nconst key = crypto.createHash('sha256').update(VENDOR_API_KEY).digest();\nconst authorization = crypto.createHmac('sha256', key).update(body).digest('hex');\n\nconst response = await fetch(URL, {\n  method: 'POST',\n  headers: {\n    'Content-Type': 'application/json',\n    Authorization: authorization,\n  },\n  body,\n});\n\nconsole.log(response.status, await response.text());\n"
        samples-languages:
