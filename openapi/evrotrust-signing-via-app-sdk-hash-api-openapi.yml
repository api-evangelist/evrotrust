        code-samples:
        - language: python
          name: Python
          code: "import hashlib, hmac, requests\n\nVENDOR_API_KEY = 'xxx'\nURL = 'https://api.sandbox.evrotrust.com/vendor/document/hash/online'\n\nbody = \"\"\"{\n  \"document\": {\n    \"hash\": \"9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08\",\n    \"description\": \"Contract for signature\",\n    \"dateExpire\": 12345678\n  },\n  \"signInfo\": {\n    \"algorithm\": \"SHA-256\"\n  },\n  \"user\": {\n    \"identificationNumber\": \"1234567890\",\n    \"country\": \"BG\",\n    //\"email\": \"user@example.com\",\n    //\"phone\": \"+359123456789\",\n    //\"automatedSignCertID\": \"<automatedSignCertID>\",\n    //\"automatedSignSealID\": \"<automatedSignSealID>\"\n  },\n  \"certificateSerialNumber\": \"1A2B3C4D5E6F\",\n  \"BIOrequired\": 0,\n  \"vendorNumber\": \"YOUR_VENDOR_NUMBER\",\n  \"urlCallback\": \"https://your-server.example.com/callback\",\n  \"publicKey\": \"<publicKey>\"\n}\"\"\"\n\n# Authorization: HMAC-SHA256 over the exact body bytes,\n# keyed by the raw SHA-256 digest of the API key\nkey = hashlib.sha256(VENDOR_API_KEY.encode()).digest()\nauthorization = hmac.new(key, body.encode('utf-8'), hashlib.sha256).hexdigest()\n\nresponse = requests.post(\n    URL,\n    headers={'Content-Type': 'application/json',\n             'Authorization': authorization},\n    data=body.encode('utf-8'),\n    timeout=30,\n)\n\nprint(response.status_code, response.text)\n"
        - language: node
          name: Node.js
          code: "const crypto = require('crypto');\n\nconst VENDOR_API_KEY = 'xxx';\nconst URL = 'https://api.sandbox.evrotrust.com/vendor/document/hash/online';\n\nconst body = JSON.stringify({\n  \"document\": {\n    \"hash\": \"9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08\",\n    \"description\": \"Contract for signature\",\n    \"dateExpire\": 12345678\n  },\n  \"signInfo\": {\n    \"algorithm\": \"SHA-256\"\n  },\n  \"user\": {\n    \"identificationNumber\": \"1234567890\",\n    \"country\": \"BG\",\n    //\"email\": \"user@example.com\",\n    //\"phone\": \"+359123456789\",\n    //\"automatedSignCertID\": \"<automatedSignCertID>\",\n    //\"automatedSignSealID\": \"<automatedSignSealID>\"\n  },\n  \"certificateSerialNumber\": \"1A2B3C4D5E6F\",\n  \"BIOrequired\": 0,\n  \"vendorNumber\": \"YOUR_VENDOR_NUMBER\",\n  \"urlCallback\": \"https://your-server.example.com/callback\",\n  \"publicKey\": \"<publicKey>\"\n});\n\n// Authorization: HMAC-SHA256 over the body, keyed by the raw SHA-256 of the API key\nconst key = crypto.createHash('sha256').update(VENDOR_API_KEY).digest();\nconst authorization = crypto.createHmac('sha256', key).update(body).digest('hex');\n\nconst response = await fetch(URL, {\n  method: 'POST',\n  headers: {\n    'Content-Type': 'application/json',\n    Authorization: authorization,\n  },\n  body,\n});\n\nconsole.log(response.status, await response.text());\n"
      requestBody:
        content:
