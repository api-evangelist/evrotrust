          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                required:
                - name
        '468':
          description: Certificate expired
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                required:
                - name
      parameters:
      - in: header
        name: Authorization
        schema:
          type: string
        required: true
        description: Authorization value.
      summary: eSign Hash
      operationId: post_document-hash-online
